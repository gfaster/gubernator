[package]
name = "gub-wire"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.186"
postcard = { version = "1.1.3", features = ["use-std"], default-features = false }
quick-xml = { version = "0.39.2", features = ["async-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = { version = "0.30.13", default-features = false }
tokio = { version = "1.52.1", default-features = false }
